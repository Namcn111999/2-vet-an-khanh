<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== SEO cơ bản – chỉnh lại khi có domain thật ===== -->
    <title>2Vet An Khánh – Phòng khám thú y uy tín tại Tây Mỗ, Hà Nội</title>
    <meta
      name="description"
      content="2Vet An Khánh – bệnh viện thú y tại 29 Lô A20 KĐT Geleximco A, Tây Mỗ, Hà Nội. Khám & điều trị bệnh, tiêm phòng, grooming cho chó mèo. Đặt lịch nhanh qua tin nhắn hoặc gọi hotline 096 34 18126."
    />
    <meta
      name="keywords"
      content="phòng khám thú y Tây Mỗ, bệnh viện thú y Geleximco, khám thú y An Khánh, tiêm phòng chó mèo Tây Mỗ, grooming thú cưng Tây Mỗ, thú y gần đây"
    />
    <link rel="canonical" href="https://2vetankhanh.vn/" />

    <!-- ===== Open Graph / chia sẻ mạng xã hội ===== -->
    <meta property="og:type" content="business.business" />
    <meta property="og:site_name" content="2Vet An Khánh" />
    <meta property="og:title" content="2Vet An Khánh – Phòng khám thú y uy tín tại Tây Mỗ, Hà Nội" />
    <meta
      property="og:description"
      content="Khám & điều trị bệnh, tiêm phòng, grooming cho chó mèo. Đặt lịch nhanh, đội ngũ bác sĩ tận tâm."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:url" content="https://2vetankhanh.vn/" />
    <meta property="og:locale" content="vi_VN" />

    <!-- ===== Favicon – dùng đúng logo thật (icon chó mèo) ===== -->
    <link rel="icon" href="/favicon.png" type="image/png" />

    <!-- ===== Font: Literata (headline, variable optical-size) + Inter (body), hỗ trợ tiếng Việt ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,300..900&family=Literata:ital,opsz,wght@1,7..72,400..700&family=Inter:wght@400;500;600;700&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
